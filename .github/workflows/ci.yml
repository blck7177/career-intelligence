name: CI

on:
  push:
    branches:
      - main
      - "0621_*"    # active gateway/production branch family
      - "0627_*"    # preprod hardening branch family
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Python: unit tests + contract check
  # -------------------------------------------------------------------------
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit and contract tests (no Docker required)
        run: |
          python -m pytest tests/ -x -q \
            --ignore=tests/integration \
            -m "not live and not integration"

  # -------------------------------------------------------------------------
  # OpenAPI contract check: ensure apps/web/openapi.json is not stale
  # -------------------------------------------------------------------------
  openapi-contract:
    name: OpenAPI contract check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check openapi.json is up to date
        run: |
          chmod +x scripts/check-openapi-contract.sh
          ./scripts/check-openapi-contract.sh

  # -------------------------------------------------------------------------
  # Migrations: the only job that actually runs the migration chain.
  # Everything else builds the schema with create_all() straight from the
  # models, so the models and the schema agree by construction and a missing
  # migration is invisible. Needs a real postgres — sqlite would prove nothing.
  # -------------------------------------------------------------------------
  migrations:
    name: Migration guard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: ci_migration_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run the migration guard
        env:
          # Explicit on purpose: env.py falls back to the production database
          # name when DATABASE_URL is unset.
          DATABASE_URL: postgresql://career:career@localhost:5432/ci_migration_guard
        run: python scripts/check-migrations.py

  # -------------------------------------------------------------------------
  # TypeScript: typecheck the generated client
  # -------------------------------------------------------------------------
  web-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Generate TypeScript client from committed OpenAPI spec
        run: npm run gen:types
        working-directory: apps/web

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Frontend unit tests
        run: npm test
        working-directory: apps/web
